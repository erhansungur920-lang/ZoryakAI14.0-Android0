
name: Zoryak AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Android projesini indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle Wrapper kontrolü
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "HATA: gradlew dosyası proje kökünde yok."
            find . -maxdepth 3 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi
          chmod +x ./gradlew

      - name: APK derle
        run: ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: ZoryakAI-14-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
